name: Prepare offline Android language build tools
on:
  push:
    paths:
      - '.github/workflows/prepare-offline-android-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android packaging toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool zipalign apksigner
          command -v apktool
          command -v zipalign
          command -v apksigner
          apktool --version
          zipalign -h >/dev/null 2>&1 || true
          apksigner --version
      - name: Assemble relocatable tool bundle
        run: |
          set -euo pipefail
          mkdir -p offline-tools/bin offline-tools/share offline-tools/lib
          # Debian apktool/apksigner scripts load JARs from /usr/share/java.
          # Save the launchers and their explicit JAR classpaths.
          cp /usr/bin/apktool /usr/bin/zipalign /usr/bin/apksigner offline-tools/bin/
          file /usr/bin/zipalign
          find /usr/share/java -maxdepth 1 \( -iname '*apktool*' -o -iname '*smali*' -o -iname '*baksmali*' -o -iname '*apksigner*' \) -printf '%f\n'
          # Bundle exact Java dependency directory. Symlinks and jars survive.
          cp -a /usr/share/java offline-tools/share/
          cp -a /usr/lib/android-sdk offline-tools/lib/android-sdk
          tar -czf offline-tools-ubuntu.tar.gz offline-tools
          du -h offline-tools-ubuntu.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: offline-android-language-tools
          path: offline-tools-ubuntu.tar.gz
          retention-days: 1
