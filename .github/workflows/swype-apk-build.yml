name: Swype APK inspection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/swype-apk-build.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input
          RELEASE_ID=435491807
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets[] | select(.name == "Swype-English-Only-REKEYED.apk") | .id')"
          test -n "$ASSET_ID"
          curl -fL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            -o input/Swype-English-Only-REKEYED.apk
          test -s input/Swype-English-Only-REKEYED.apk
          unzip -t input/Swype-English-Only-REKEYED.apk >/dev/null
      - name: Install APK analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool default-jdk
          mkdir -p tools/jadx
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d tools/jadx
      - name: Decode and inspect language/theme code
        run: |
          apktool d -f input/Swype-English-Only-REKEYED.apk -o decoded
          tools/jadx/bin/jadx --no-res -d java-src input/Swype-English-Only-REKEYED.apk || echo 'jadx reported partial decompilation errors; preserving output'
          grep -R -l -E 'GitHubThemesFragment|LanguageDownloadTransaction|LanguageInstall' java-src > language-class-files.txt || true
          grep -R -n -E 'api-swype.swypeconnect.com|lbs-swype.swypeconnect.com|requestLanguagesList|downloadLanguagePack' java-src | head -150 > language-network-references.txt || true
      - name: Archive inspection output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swype-inspection
          path: |
            language-class-files.txt
            language-network-references.txt
            java-src/
            decoded/
          retention-days: 7
