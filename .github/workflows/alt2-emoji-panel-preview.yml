name: Alt2 emoji panel preview APK
on:
  push:
    branches: [ 'experiment/alt2-emoji-panel' ]
    paths:
      - 'alt2-preview/**'
      - '.github/workflows/alt2-emoji-panel-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build isolated preview APK
        working-directory: alt2-preview
        run: gradle --no-daemon :app:assembleDebug
      - name: Archive APK for Samsung test
        uses: actions/upload-artifact@v4
        with:
          name: Swype-Alt2-Emoji-PREVIEW-APK
          path: alt2-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
