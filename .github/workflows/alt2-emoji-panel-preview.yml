name: Alt2 emoji panel preview APK
on:
  push:
    branches: [ 'experiment/alt2-emoji-panel' ]
    paths:
      - 'alt2-preview/**'
      - '.github/workflows/alt2-emoji-panel-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build isolated preview APK
        working-directory: alt2-preview
        run: gradle --no-daemon :app:assembleDebug
      - name: Explicitly sign and verify preview APK
        working-directory: alt2-preview
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BT="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BT/apksigner"
          test -x "$BT/aapt"
          "$BT/aapt" dump badging "$APK" | head -n 5
          if ! "$BT/apksigner" verify "$APK"; then
            keytool -genkeypair -noprompt -keystore /tmp/alt2-preview.jks -storepass android -keypass android -alias alt2preview -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=Alt2 Preview'
            "$BT/apksigner" sign --ks /tmp/alt2-preview.jks --ks-pass pass:android --key-pass pass:android --ks-key-alias alt2preview "$APK"
          fi
          "$BT/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
      - name: Archive APK for Samsung test
        uses: actions/upload-artifact@v4
        with:
          name: Swype-Alt2-Emoji-PREVIEW-APK
          path: alt2-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
