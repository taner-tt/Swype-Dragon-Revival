name: Build Swype with offline language receiver (experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - 'offline-installer/swype-patch/**'
      - '.github/workflows/swype-offline-receiver.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download base APK from existing private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ID=435491807
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets[] | select(.name == "Swype-English-Only-REKEYED.apk") | .id')"
          test -n "$ASSET_ID"
          curl -fL --retry 3 -H "Authorization: Bear ${GH_TOKEN}" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" -o base.apk
          unzip -t base.apk >/dev/null
      - name: Compile import Activity to DEX
        run: |
          set -euo pipefail
          mkdir -p compiled dex
          javac --release 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d compiled \
            offline-installer/swype-patch/compile-stubs/com/nuance/swype/connect/LanguageInstall.java \
            offline-installer/swype-patch/src/com/swyperevival/offline/OfflineLanguageImportActivity.java
          # Do not include the compile-time LanguageInstall stub in the DEX.
          rm -rf compiled/com/nuance
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 24 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output dex compiled/com/swyperevival/offline/*.class
          test -s dex/classes.dex
      - name: Disassemble receiver DEX and merge into Swype
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('base.apk') as source, zipfile.ZipFile('receiver-temp.apk', 'w') as out:
              for info in source.infolist():
                  if info.filename == 'classes.dex':
                      out.writestr(info, open('dex/classes.dex','rb').read())
                  elif info.filename.startswith('classes') and info.filename.endswith('.dex'):
                      continue
                  else:
                      out.writestr(info, source.read(info))
          PY
          apktool d -f receiver-temp.apk -o receiver-decoded
          apktool d -f base.apk -o swype-decoded
          test -f receiver-decoded/smali/com/swyperevival/offline/OfflineLanguageImportActivity.smali
          mkdir -p swype-decoded/smali_classes99/com/swyperevival
          cp -R receiver-decoded/smali/com/swyperevival/offline swype-decoded/smali_classes99/com/swyperevival/
          python3 offline-installer/swype-patch/patch_manifest.py swype-decoded/AndroidManifest.xml
          apktool b swype-decoded -o Swype-Offline-Receiver-UNSIGNED.apk
          unzip -t Swype-Offline-Receiver-UNSIGNED.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Swype-Offline-Receiver-UNSIGNED-EXPERIMENTAL
          path: Swype-Offline-Receiver-UNSIGNED.apk
          retention-days: 7
