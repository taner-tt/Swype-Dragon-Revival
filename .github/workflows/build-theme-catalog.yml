name: Build Swype theme catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_theme_catalog.py'
      - 'tools/render_theme_background.py'
      - '.github/workflows/build-theme-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APKTOOL_JAR: /tmp/apktool.jar
    steps:
      - uses: actions/checkout@v4
      - name: Install preview renderer and pinned apktool
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          curl -fL --retry 3 -o "$APKTOOL_JAR" https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /tmp/apktool.jar' | sha256sum -c -
          java -jar "$APKTOOL_JAR" --version
      - name: Generate catalog and previews from themes-v1 release assets
        run: python3 tools/build_theme_catalog.py
      - name: Verify catalog
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from collections import Counter
          with open('themes.json', encoding='utf-8') as f: d=json.load(f)
          assert d['schema']==2
          assert d['count']>=270 and len(d['themes'])==d['count']
          assert all(x['url'].startswith('https://github.com/taner-tt/Swype-Dragon-Revival/releases/download/themes-v1/') for x in d['themes'])
          assert all(len(x['sha256'])==64 for x in d['themes'])
          paths=['theme-previews/'+x['id']+'.png' for x in d['themes']]
          assert all(os.path.isfile(p) and os.path.getsize(p)>500 for p in paths)
          hashes=Counter(hashlib.sha256(open(p,'rb').read()).hexdigest() for p in paths)
          print(f"Verified {d['count']} themes and {d['count']} layer-rendered previews; {len(hashes)} distinct preview images")
          PY
      - name: Commit generated catalog and previews
        run: |
          if [ -z "$(git status --porcelain -- themes.json theme-previews)" ]; then
            echo 'catalog and previews already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add themes.json theme-previews
          git commit -m 'Update generated Swype theme catalog and previews'
          git push
