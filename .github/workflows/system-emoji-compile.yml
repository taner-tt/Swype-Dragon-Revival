name: Verify Android system emoji module
on:
  push:
    branches: ['experiment/emoji-gif-first']
    paths:
      - 'emoji-gif/system-emoji/**'
      - 'emoji-gif/nuance-integration/**'
      - 'emoji-gif/diagnostics/**'
      - '.github/workflows/system-emoji-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run pure Java emoji tests
        run: |
          set -euo pipefail
          mkdir -p build/emoji-test
          javac -encoding UTF-8 -d build/emoji-test emoji-gif/system-emoji/SystemEmojiCatalog.java emoji-gif/system-emoji/SystemEmojiCatalogTest.java
          java -ea -cp build/emoji-test com.swypedragon.emoji.SystemEmojiCatalogTest
          javac -encoding UTF-8 -d build/emoji-test emoji-gif/system-emoji/StableEmojiRecents.java emoji-gif/system-emoji/StableEmojiRecentsTest.java
          java -ea -cp build/emoji-test com.swypedragon.emoji.StableEmojiRecentsTest
          javac -encoding UTF-8 -d build/emoji-test emoji-gif/system-emoji/EmojiCatalogBridge.java emoji-gif/system-emoji/EmojiCatalogBridgeTest.java emoji-gif/system-emoji/EmojiPageBridge.java emoji-gif/system-emoji/EmojiPageBridgeTest.java
          java -ea -cp build/emoji-test com.swypedragon.emoji.EmojiCatalogBridgeTest
          java -ea -cp build/emoji-test com.swypedragon.emoji.EmojiPageBridgeTest
          javac -encoding UTF-8 -cp build/emoji-test -d build/emoji-test emoji-gif/system-emoji/stubs/com/nuance/swype/input/emoji/Emoji.java emoji-gif/system-emoji/stubs/com/nuance/swype/input/emoji/EmojiLoader.java emoji-gif/system-emoji/SwypeEmojiHostAdapter.java emoji-gif/system-emoji/SwypeEmojiHostAdapterTest.java
          java -ea -cp build/emoji-test com.swypedragon.emoji.SwypeEmojiHostAdapterTest
      - name: Compile host adapter against verified Nuance signatures
        run: |
          set -euo pipefail
          mkdir -p build/nuance-emoji
          javac -encoding UTF-8 -d build/nuance-emoji emoji-gif/nuance-integration/SwypeEmojiOrder.java emoji-gif/nuance-integration/NuanceEmojiStubs.java emoji-gif/nuance-integration/SwypeEmojiOrderTest.java
          java -ea -cp build/nuance-emoji com.nuance.swype.input.emoji.SwypeEmojiOrderTest
      - name: Compile Android ICU and glyph support against real Android SDK
        run: |
          set -euo pipefail
          SDK_JAR="$(find "$ANDROID_HOME/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)"
          test -s "$SDK_JAR"
          echo "SDK: $SDK_JAR"
          mkdir -p build/android-emoji
          javac -encoding UTF-8 -source 8 -target 8 -cp "$SDK_JAR" -d build/android-emoji emoji-gif/system-emoji/SystemEmojiCatalog.java emoji-gif/system-emoji/AndroidEmojiSource.java emoji-gif/system-emoji/SystemEmojiPage.java
          test -s build/android-emoji/com/swypedragon/emoji/AndroidEmojiSource.class
          test -s build/android-emoji/com/swypedragon/emoji/SystemEmojiPage.class
      - name: Verify safe emoji runtime log parser
        run: |
          set -euo pipefail
          python emoji-gif/diagnostics/test_emoji_logcat.py
      - name: Verify no APK or theme assets were changed
        run: |
          test ! -e build/Swype.apk
          test ! -e build/Swype-theme.apk
          test -s build/android-emoji/com/swypedragon/emoji/AndroidEmojiSource.class
