name: Check GitHub language bridge (no release)

on:
  workflow_dispatch:
  push:
    paths:
      - 'language-packs/patch_language_catalog.py'
      - 'language-packs/test_github_bridge_error_handling.py'
      - '.github/workflows/check-language-bridge.yml'

permissions:
  contents: read

jobs:
  static-and-apk-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated fallback logic
        run: python3 -m unittest discover -v -s language-packs -p 'test_github_bridge_error_handling.py'
      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
      - name: Obtain reference APK from existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input
          RELEASE_ID=435491807
          ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets[] | select(.name == "Swype-English-Only-REKEYED.apk") | .id')"
          test -n "$ASSET_ID"
          curl -fL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" -o input/base.apk
          unzip -t input/base.apk >/dev/null
      - name: Build temporary synthetic-catalog APK (never published)
        run: |
          set -euo pipefail
          apktool d -f input/base.apk -o decoded
          mkdir -p /tmp/github-bridge-test
          cp language-packs/patch_language_catalog.py /tmp/github-bridge-test/
          python3 - <<'PY'
          import json
          from pathlib import Path
          entry = {
            "11": "Swedish", "20": "SYNTHETIC-TEST",
            "51": "https://github.com/example/test/releases/download/v1/test.zip",
            "10": "0123456789abcdef0123456789abcdef", "122": "SE",
            "124": "Svenska", "146": [285], "102": "0.0"
          }
          Path("/tmp/github-bridge-test/nuance-language-list.json").write_text(json.dumps({"43":[entry]}))
          PY
          python3 /tmp/github-bridge-test/patch_language_catalog.py decoded
          apktool b decoded -o /tmp/github-language-bridge-build-check-UNSIGNED.apk
          unzip -t /tmp/github-language-bridge-build-check-UNSIGNED.apk >/dev/null
          echo 'Smali integration compiled. No APK/signing files uploaded.'
